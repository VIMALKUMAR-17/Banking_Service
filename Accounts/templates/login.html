{% extends 'bankingsystem.html' %}
{% load static %}

{% block title %}Login | VK Banking System{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'logins.css' %}">
{% endblock %}

{% block content %}
<div class="page page--tiny">
    <div class="card card--pad reveal">
        <header class="login-head">
            <span class="login-head__icon"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg></span>
            <h1>Login</h1>
        </header>
        <form action="" method="post">
            {% csrf_token %}
            {% if error %}
            <div class="alert alert--error login-alert" role="alert"><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><span>{{error}}</span></div>
            {% endif %}
            <div class="field">
                <label class="field__label" for="username">Username</label>
                <input class="control" type="text" name="username" id="username" value="{{form.username|default:''}}" autocomplete="username">
            </div>
            <div class="field login-field">
                <label class="field__label" for="password">Password</label>
                <input class="control" type="password" name="password" id="password" autocomplete="current-password">
            </div>
            <div class="btn-row">
                <button class="btn btn--primary btn--block">Login</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
